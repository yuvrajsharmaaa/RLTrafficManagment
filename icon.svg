<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1c38"/>
      <stop offset="65%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#040814"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Outer Quantum Orbit Ring -->
  <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" transform="rotate(30 256 256)"/>

  <!-- Swarm Quantum Particles -->
  <circle cx="100" cy="180" r="7" fill="#38bdf8" opacity="0.8"/>
  <circle cx="410" cy="330" r="7" fill="#38bdf8" opacity="0.8"/>
  <circle cx="390" cy="170" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="120" cy="340" r="5" fill="#38bdf8" opacity="0.6"/>

  <!-- Medical Cross Glow Backdrop -->
  <rect x="220" y="120" width="72" height="272" rx="18" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>
  <rect x="120" y="220" width="272" height="72" rx="18" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>

  <!-- Emergency Medical Cross (Clean Red + White Border) -->
  <path d="M 216 126
           A 14 14 0 0 1 230 112 L 282 112
           A 14 14 0 0 1 296 126 L 296 216 L 386 216
           A 14 14 0 0 1 400 230 L 400 282
           A 14 14 0 0 1 386 296 L 296 296 L 296 386
           A 14 14 0 0 1 282 400 L 230 400
           A 14 14 0 0 1 216 386 L 216 296 L 126 296
           A 14 14 0 0 1 112 282 L 112 230
           A 14 14 0 0 1 126 216 L 216 216 Z"
        fill="url(#redGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>

  <!-- Center Ambulance Silhouette -->
  <g transform="translate(196, 206) scale(2.5)" fill="#ffffff">
    <!-- Ambulance Body -->
    <path d="M 3 14 L 3 32 A 3 3 0 0 0 6 35 L 9 35 A 6 6 0 0 1 21 35 L 29 35 A 6 6 0 0 1 41 35 L 45 35 A 3 3 0 0 0 48 32 L 48 24 L 40 14 Z" fill="#ffffff"/>
    <!-- Cab Window -->
    <polygon points="38,16 45,23 34,23 34,16" fill="#091024"/>
    <!-- Siren Beacon on roof -->
    <rect x="20" y="10" width="8" height="4" rx="2" fill="#ef4444"/>
    <!-- Red Cross on Ambulance Door -->
    <path d="M 17 21 h 4 v -3 h 3 v 3 h 4 v 3 h -4 v 3 h -3 v -3 h -4 z" fill="#ef4444"/>
    <!-- Wheels -->
    <circle cx="15" cy="35" r="4.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="4.5" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Subtle QPSO Badge text at bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#38bdf8" text-anchor="middle" opacity="0.9">DELHI QPSO EMS</text>
</svg>